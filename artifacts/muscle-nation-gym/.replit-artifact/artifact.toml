kind = "web"
previewPath = "/"
title = "The Muscle Nation Gym"
version = "1.0.0"
id = "artifacts/muscle-nation-gym"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21543

[services.development]
run = "pnpm --filter @workspace/muscle-nation-gym run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/muscle-nation-gym", "run", "build" ]
serve = "static"
publicDir = "artifacts/muscle-nation-gym/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21543"
BASE_PATH = "/"
